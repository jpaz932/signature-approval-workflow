openapi: 3.0.3
info:
  title: Signature Approval Workflow API
  version: "1.0.0"
  description: |
    API del flujo de aprobación de solicitudes de compra con firma digital de 3
    aprobadores, verificación por OTP, y evidencia en PDF.

    ## Cómo probar el flujo completo

    1. `POST /api/solicitudes` — crear una solicitud con 3 aprobadores.
    2. `GET /mock-mail` — como no hay correo real, acá aparece el "correo" simulado de
       cada aprobador con su link (`requestId` + `token`) y su código OTP (válido 3
       minutos desde la creación de la solicitud).
    3. `GET /api/approvals/{id}/{token}` — abrir el link como aprobador. Solo devuelve
       info mínima (nombre/rol del aprobador, título de la solicitud); todavía no pide
       ni valida el OTP.
    4. `POST /api/approvals/{id}/{token}/verify-otp` — con el `code` obtenido en el
       paso 2. Si es correcto, devuelve recién ahí el detalle completo de la solicitud
       (monto, descripción, estado de las 3 aprobaciones).
    5. `POST /api/approvals/{id}/{token}/sign` o `.../reject` — con el mismo `code`.
       Firmar o rechazar vuelve a validar el OTP como parte de esa misma acción (no se
       confía en que ya se verificó en el paso anterior).
    6. Al firmar las 3 aprobaciones, la solicitud pasa a `COMPLETED` y queda
       disponible el PDF de evidencia.
    7. `GET /api/solicitudes/{id}/evidencia.pdf` — descarga el PDF (respuesta binaria).

servers:
  - url: https://qb8tt59p11.execute-api.us-east-1.amazonaws.com
    description: Desplegado (stage dev, us-east-1)
  - url: http://localhost:3000
    description: Local (serverless offline) — usa las mismas tablas/bucket de AWS

tags:
  - name: Solicitudes
    description: Vista del solicitante
  - name: Aprobaciones
    description: Vista del aprobador (acceso por link único)
  - name: Utilidades

paths:
  /health:
    get:
      tags: [Utilidades]
      summary: Chequeo de salud
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /mock-mail:
    get:
      tags: [Utilidades]
      summary: Lista los correos simulados enviados
      description: >
        Como no se configura SMTP real, cada notificación (link + OTP) queda registrada
        acá para poder probar el flujo sin acceso a un correo real.
      responses:
        "200":
          description: Lista de correos simulados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MockMailEntry"

  /api/solicitudes:
    post:
      tags: [Solicitudes]
      summary: Crear una solicitud de compra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseRequestInput"
            example:
              title: Compra de laptops
              description: 3 laptops para el equipo de desarrollo
              amount: 12000000
              requester:
                name: Juan Pérez
                email: juan@example.com
              approvers:
                - name: Ana Gómez
                  email: ana@example.com
                  role: MANAGER
                - name: Luis Rojas
                  email: luis@example.com
                  role: FINANCE
                - name: Marta Díaz
                  email: marta@example.com
                  role: DIRECTOR
      responses:
        "201":
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Solicitudes]
      summary: Listar todas las solicitudes
      responses:
        "200":
          description: Lista de solicitudes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseRequest"

  /api/solicitudes/{id}:
    get:
      tags: [Solicitudes]
      summary: Detalle de una solicitud
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Detalle de la solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/solicitudes/{id}/evidencia.pdf:
    get:
      tags: [Solicitudes]
      summary: Descargar el PDF de evidencia
      description: Solo disponible una vez la solicitud está `COMPLETED`.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: PDF de evidencia
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: >
            La solicitud no existe, o todavía no tiene evidencia generada (mensaje
            "Evidence PDF is not available yet").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/approvals/{id}/{token}:
    get:
      tags: [Aprobaciones]
      summary: Info mínima para un aprobador (abrir el link)
      description: >
        Acceso mediante el link único enviado (simulado) por correo. Todavía no pide
        ni valida el OTP, y por eso **no** expone monto/descripción — solo lo
        necesario para renderizar la pantalla de "ingresa tu código" (nombre/rol del
        aprobador y título de la solicitud). El detalle completo se obtiene recién en
        `POST .../verify-otp`.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApproverToken"
      responses:
        "200":
          description: Info mínima de la solicitud y del aprobador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalSummary"
        "404":
          description: >
            La solicitud no existe, o el token no corresponde a ninguna aprobación
            (mensaje "Invalid approval token").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/approvals/{id}/{token}/verify-otp:
    post:
      tags: [Aprobaciones]
      summary: Verificar el OTP y obtener el detalle completo
      description: >
        No muta ningún estado — solo valida el código. Si es correcto, devuelve el
        detalle completo de la solicitud más el `approvalId` de quien abrió el link,
        para que el frontend sepa a cuál de las 3 aprobaciones corresponde y pueda
        mostrar el botón de aprobar/rechazar.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApproverToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpCodeInput"
      responses:
        "200":
          description: Detalle completo de la solicitud + approvalId del aprobador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalView"
        "400":
          description: OTP incorrecto o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/approvals/{id}/{token}/sign:
    post:
      tags: [Aprobaciones]
      summary: Firmar la aprobación
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApproverToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpCodeInput"
      responses:
        "200":
          description: >
            Solicitud actualizada. Si esta era la 3ª firma, el PDF de evidencia ya
            quedó generado y `status` pasa a `COMPLETED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          description: >
            OTP incorrecto o expirado, token inválido, o la aprobación/solicitud ya
            no admite cambios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/approvals/{id}/{token}/reject:
    post:
      tags: [Aprobaciones]
      summary: Rechazar la aprobación
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ApproverToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpCodeInput"
      responses:
        "200":
          description: Solicitud actualizada, `status` pasa a `REJECTED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          description: >
            OTP incorrecto o expirado, token inválido, o la aprobación/solicitud ya
            no admite cambios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Id de la solicitud de compra
    ApproverToken:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: Token único del aprobador (viene en el link de su correo simulado)

  responses:
    NotFound:
      description: La solicitud no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Body o parámetros inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      example:
        message: Purchase request not found

    Requester:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    CreatePurchaseRequestInput:
      type: object
      required: [title, description, amount, requester, approvers]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        requester:
          $ref: "#/components/schemas/Requester"
        approvers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [name, email, role]
            properties:
              name:
                type: string
                minLength: 1
              email:
                type: string
                format: email
              role:
                type: string
                minLength: 1
                description: Debe ser distinto para cada uno de los 3 aprobadores.

    OtpCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: Código OTP de 6 dígitos, obtenido vía /mock-mail.
          example: "123456"

    ApprovalDetail:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [PENDING, SIGNED, REJECTED]
        signedAt:
          type: string
          format: date-time
          nullable: true
        rejectedAt:
          type: string
          format: date-time
          nullable: true

    PurchaseRequest:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        amount:
          type: number
        requester:
          $ref: "#/components/schemas/Requester"
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, COMPLETED, REJECTED]
        evidenceAvailable:
          type: boolean
          description: True una vez el PDF de evidencia fue generado.
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalDetail"

    ApprovalSummary:
      type: object
      description: >
        Info mínima devuelta al abrir el link, antes de verificar el OTP.
      properties:
        requestId:
          type: string
        requestTitle:
          type: string
        approverName:
          type: string
        approverRole:
          type: string
        status:
          type: string
          enum: [PENDING, SIGNED, REJECTED]

    ApprovalView:
      description: Detalle completo de la solicitud + approvalId del aprobador.
      allOf:
        - $ref: "#/components/schemas/PurchaseRequest"
        - type: object
          properties:
            approvalId:
              type: string

    MockMailEntry:
      type: object
      properties:
        requestId:
          type: string
        approvalId:
          type: string
        email:
          type: string
          format: email
        subject:
          type: string
        body:
          type: string
          description: Incluye el link de aprobación y el código OTP.
        sentAt:
          type: string
          format: date-time
